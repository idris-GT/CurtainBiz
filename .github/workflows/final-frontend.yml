name: Finish CurtainBiz Frontend

on:
  push:
    branches: [codex/final-frontend]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final frontend changes
        shell: python
        run: |
          from pathlib import Path
          app = Path("frontend/src/App.jsx")
          css = Path("frontend/src/App.css")
          text = app.read_text(encoding="utf-8")
          text = text.replace('  const [permissions, setPermissions] = useState([]);\n', '''  const [permissions, setPermissions] = useState([]);\n  const [profileOpen, setProfileOpen] = useState(false);\n  const [notificationsOpen, setNotificationsOpen] = useState(false);\n  const [settingsSection, setSettingsSection] = useState("profile");\n  const [displayName, setDisplayName] = useState(() => localStorage.getItem("curtainbiz_display_name") || "");\n  const [profileSaved, setProfileSaved] = useState(false);\n''')
          marker = '  const permissionSet = new Set(permissions);\n'
          insert = '''  const permissionSet = new Set(permissions);\n\n  const resolvedDisplayName = displayName || currentUser.email?.split("@")[0]?.replace(/[._-]+/g, " ") || "User";\n\n  const notificationItems = [\n    dashboardData.payments > 0 ? { title: "Pending payments", message: `${formatCurrency(dashboardData.payments)} is currently pending.`, icon: "₹" } : null,\n    dashboardData.orders > 0 ? { title: "Active orders", message: `${dashboardData.orders} order${dashboardData.orders === 1 ? "" : "s"} require attention.`, icon: "◫" } : null,\n    dashboardData.production > 0 ? { title: "Production workload", message: `${dashboardData.production} production item${dashboardData.production === 1 ? "" : "s"} are active.`, icon: "⚙" } : null,\n  ].filter(Boolean);\n\n  const saveProfile = () => {\n    localStorage.setItem("curtainbiz_display_name", displayName.trim());\n    setDisplayName(displayName.trim());\n    setProfileSaved(true);\n    window.setTimeout(() => setProfileSaved(false), 2200);\n  };\n\n  const signOut = () => {\n    localStorage.removeItem("access_token");\n    window.location.href = "/login";\n  };\n'''
          text = text.replace(marker, insert, 1)
          text = text.replace('    if (activePage === "Dashboard") {\n', '''    if (activePage === "Settings") {\n      return <SettingsPage currentUser={currentUser} displayName={displayName} resolvedDisplayName={resolvedDisplayName} setDisplayName={setDisplayName} profileSaved={profileSaved} onSaveProfile={saveProfile} section={settingsSection} setSection={setSettingsSection} onSignOut={signOut} />;\n    }\n\n    if (activePage === "Dashboard") {\n''', 1)
          old = '''          <div className="user-card">\n            <div className="avatar">\n              {getInitials(\n                currentUser.email ||\n                  currentUser.role ||\n                  "User"\n              )}\n            </div>\n\n            <div className="user-info">\n              <strong>\n                {currentUser.email || "User"}\n              </strong>\n              <span>\n                {formatRoleName(currentUser.role)}\n              </span>\n            </div>\n\n            <span className="user-menu">\n              ⋮\n            </span>\n          </div>'''
          new = '''          <button className="user-card" onClick={() => setProfileOpen((open) => !open)} aria-expanded={profileOpen} aria-label="Open account menu">\n            <div className="avatar">{getInitials(resolvedDisplayName)}</div>\n            <div className="user-info">\n              <strong>{resolvedDisplayName}</strong>\n              <span>{formatRoleName(currentUser.role)}</span>\n            </div>\n            <span className="user-menu">{profileOpen ? "⌃" : "⋮"}</span>\n          </button>'''
          if old not in text: raise SystemExit("sidebar user block not found")
          text = text.replace(old, new, 1)
          old = '''            <button\n              className="icon-button notification"\n              title="Notifications"\n              onClick={() =>\n                setActivePage("Notifications")\n              }\n            >\n              ♢\n              <span></span>\n            </button>'''
          new = '''            <div className="notification-wrap">\n              <button className="icon-button notification" title="Notifications" onClick={() => setNotificationsOpen((open) => !open)} aria-expanded={notificationsOpen}>\n                ♢\n                {notificationItems.length > 0 && <span></span>}\n              </button>\n              {notificationsOpen && (\n                <div className="notification-panel">\n                  <div className="notification-panel-header"><div><strong>Notifications</strong><small>Live operational signals</small></div><button onClick={() => setNotificationsOpen(false)}>×</button></div>\n                  {notificationItems.length === 0 ? (\n                    <div className="notification-empty"><div>✓</div><strong>You're all caught up</strong><span>No active operational alerts right now.</span></div>\n                  ) : (\n                    <div className="notification-list">{notificationItems.map((item) => <div className="notification-item" key={item.title}><div className="notification-icon">{item.icon}</div><div><strong>{item.title}</strong><span>{item.message}</span></div></div>)}</div>\n                  )}\n                </div>\n              )}\n            </div>'''
          if old not in text: raise SystemExit("notification block not found")
          text = text.replace(old, new, 1)
          old = '''            <div className="top-user">\n              <div className="avatar">\n                {getInitials(\n                  currentUser.email ||\n                    currentUser.role ||\n                    "User"\n                )}\n              </div>\n\n              <div>\n                <strong>\n                  {currentUser.email || "User"}\n                </strong>\n                <small>\n                  {formatRoleName(currentUser.role)}\n                </small>\n              </div>\n            </div>'''
          new = '''            <button className="top-user top-user-trigger" onClick={() => setProfileOpen((open) => !open)} aria-expanded={profileOpen} aria-label="Open account menu">\n              <div className="avatar">{getInitials(resolvedDisplayName)}</div>\n              <div><strong>{resolvedDisplayName}</strong><small>{formatRoleName(currentUser.role)}</small></div>\n              <span className="top-user-chevron">⌄</span>\n            </button>\n            {profileOpen && (\n              <div className="profile-menu">\n                <div className="profile-menu-header"><div className="avatar avatar-large">{getInitials(resolvedDisplayName)}</div><div><strong>{resolvedDisplayName}</strong><span>{currentUser.email || "No email"}</span><small>{formatRoleName(currentUser.role)}</small></div></div>\n                <div className="profile-menu-divider" />\n                <button onClick={() => { setSettingsSection("profile"); setActivePage("Settings"); setProfileOpen(false); }}><span>◉</span> My Profile</button>\n                <button onClick={() => { setSettingsSection("preferences"); setActivePage("Settings"); setProfileOpen(false); }}><span>⚙</span> Account Settings</button>\n                <button onClick={() => { setSettingsSection("security"); setActivePage("Settings"); setProfileOpen(false); }}><span>⌁</span> Security</button>\n                <div className="profile-menu-divider" />\n                <button className="profile-signout" onClick={signOut}><span>↪</span> Sign out</button>\n              </div>\n            )}'''
          if old not in text: raise SystemExit("top user block not found")
          text = text.replace(old, new, 1)
          settings = r'''\n\nfunction SettingsPage({ currentUser, displayName, resolvedDisplayName, setDisplayName, profileSaved, onSaveProfile, section, setSection, onSignOut }) {\n  const items = [\n    { id: "profile", icon: "◉", label: "Profile", description: "Identity and account details" },\n    { id: "preferences", icon: "⚙", label: "Preferences", description: "Workspace behaviour" },\n    { id: "security", icon: "⌁", label: "Security", description: "Access and session" },\n    { id: "about", icon: "ⓘ", label: "About", description: "CurtainBiz information" },\n  ];\n  return (\n    <section className="settings-page">\n      <div className="settings-heading"><div><p className="eyebrow">WORKSPACE</p><h3>Settings</h3><p>Manage your CurtainBiz account and workspace preferences.</p></div></div>\n      <div className="settings-layout">\n        <aside className="settings-nav">{items.map((item) => <button key={item.id} className={section === item.id ? "settings-nav-item active" : "settings-nav-item"} onClick={() => setSection(item.id)}><span className="settings-nav-icon">{item.icon}</span><span><strong>{item.label}</strong><small>{item.description}</small></span></button>)}</aside>\n        <div className="settings-content">\n          {section === "profile" && <div className="settings-card">\n            <div className="settings-card-heading"><div><h4>Profile</h4><p>Your identity inside CurtainBiz.</p></div>{profileSaved && <span className="save-badge">Saved</span>}</div>\n            <div className="profile-summary"><div className="avatar avatar-xl">{getInitials(resolvedDisplayName)}</div><div><strong>{resolvedDisplayName}</strong><span>{currentUser.email || "No email available"}</span><small>{formatRoleName(currentUser.role)}</small></div></div>\n            <div className="settings-form-grid">\n              <label><span>Display name</span><input value={displayName} onChange={(event) => setDisplayName(event.target.value)} placeholder="Enter your display name" maxLength={60} /><small>Saved on this browser. Your authenticated email remains unchanged.</small></label>\n              <label><span>Email</span><input value={currentUser.email || ""} readOnly /><small>Your login email comes from the authenticated account.</small></label>\n              <label><span>Role</span><input value={formatRoleName(currentUser.role)} readOnly /><small>Role and permissions are controlled by backend RBAC.</small></label>\n              <label><span>User ID</span><input value={currentUser.user_id || ""} readOnly /><small>System identifier for this account.</small></label>\n            </div>\n            <div className="settings-actions"><button className="primary-button" onClick={onSaveProfile}>Save profile</button></div>\n          </div>}\n          {section === "preferences" && <div className="settings-card"><div className="settings-card-heading"><div><h4>Preferences</h4><p>Workspace preferences that are safe to control locally.</p></div></div>\n            <div className="preference-row"><div><strong>Notifications</strong><span>Operational alerts are shown from live dashboard data.</span></div><span className="preference-status">Active</span></div>\n            <div className="preference-row"><div><strong>Dashboard data</strong><span>Dashboard cards use live API data available to your role.</span></div><span className="preference-status">Live</span></div>\n            <div className="preference-row"><div><strong>Theme</strong><span>The current CurtainBiz workspace uses the professional light theme.</span></div><span className="preference-status">Light</span></div>\n          </div>}\n          {section === "security" && <div className="settings-card"><div className="settings-card-heading"><div><h4>Security</h4><p>Review your current session and access state.</p></div><span className="security-badge">Authenticated</span></div>\n            <div className="security-grid"><div><span>Account</span><strong>{currentUser.email || "—"}</strong></div><div><span>Role</span><strong>{formatRoleName(currentUser.role)}</strong></div><div><span>Authentication</span><strong>Supabase JWT</strong></div><div><span>Access control</span><strong>RBAC enabled</strong></div></div>\n            <div className="danger-zone"><div><strong>Sign out of CurtainBiz</strong><span>End the current browser session and return to the login screen.</span></div><button onClick={onSignOut}>Sign out</button></div>\n          </div>}\n          {section === "about" && <div className="settings-card about-card"><div className="about-mark">CB</div><p className="eyebrow">BUSINESS OPERATIONS PLATFORM</p><h4>CurtainBiz</h4><p>Portfolio-grade business operations software for curtain and blinds manufacturing workflows.</p><div className="about-meta"><span><strong>Version</strong> 1.0.0</span><span><strong>Frontend</strong> React + Vite</span><span><strong>Backend</strong> FastAPI</span><span><strong>Database</strong> PostgreSQL / Supabase</span></div></div>}\n        </div>\n      </div>\n    </section>\n  );\n}\n\n'''
          text = text.replace('export default App;\n', settings + 'export default App;\n', 1)
          app.write_text(text, encoding="utf-8")
          css.write_text(css.read_text(encoding="utf-8") + r'''\n\n/* Final professional shell */\n.user-card{appearance:none;border-left:0;border-right:0;border-bottom:0;color:inherit;text-align:left;cursor:pointer}.user-card:hover{background:#182235}.top-user-trigger{border:0;background:transparent;color:inherit;cursor:pointer;text-align:left;padding:4px 5px;border-radius:10px}.top-user-trigger:hover{background:#f5f7fb}.top-user-chevron{color:#8993a4;margin-left:2px}.notification-wrap{position:relative}.profile-menu,.notification-panel{position:absolute;z-index:50;background:#fff;border:1px solid #e1e6ed;box-shadow:0 18px 45px rgba(16,24,39,.14);border-radius:12px}.profile-menu{right:24px;top:68px;width:270px;padding:8px}.profile-menu-header{display:flex;align-items:center;gap:10px;padding:10px}.profile-menu-header strong,.profile-menu-header span,.profile-menu-header small{display:block}.profile-menu-header strong{color:#172033;font-size:12px}.profile-menu-header span{color:#667085;font-size:10px;margin-top:3px;overflow-wrap:anywhere}.profile-menu-header small{color:#929baa;font-size:9px;margin-top:2px}.avatar-large{width:42px;height:42px}.profile-menu-divider{height:1px;background:#edf0f4;margin:5px 0}.profile-menu>button{width:100%;border:0;background:transparent;border-radius:8px;padding:10px;color:#344054;display:flex;align-items:center;gap:10px;font-size:11px;cursor:pointer;text-align:left}.profile-menu>button:hover{background:#f5f7fb}.profile-menu>button span{width:20px;text-align:center;color:#667085}.profile-menu .profile-signout,.profile-menu .profile-signout span{color:#b54747}.notification-panel{right:-20px;top:46px;width:340px;overflow:hidden}.notification-panel-header{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-bottom:1px solid #edf0f4}.notification-panel-header strong,.notification-panel-header small{display:block}.notification-panel-header strong{font-size:12px;color:#172033}.notification-panel-header small{color:#8a93a2;font-size:9px;margin-top:3px}.notification-panel-header button{border:0;background:transparent;color:#8993a4;cursor:pointer;font-size:18px}.notification-list{padding:6px}.notification-item{display:flex;gap:10px;padding:11px 10px;border-radius:9px}.notification-item:hover{background:#f7f8fa}.notification-icon{width:30px;height:30px;border-radius:8px;background:#f0f3f7;display:flex;align-items:center;justify-content:center;color:#44536b;flex-shrink:0}.notification-item strong,.notification-item span{display:block}.notification-item strong{font-size:10px;color:#2c374b}.notification-item span{font-size:9px;color:#7d8797;line-height:1.5;margin-top:3px}.notification-empty{padding:28px 18px 32px;text-align:center}.notification-empty>div{width:38px;height:38px;margin:0 auto 10px;border-radius:50%;background:#edf8f1;color:#3e865e;display:flex;align-items:center;justify-content:center}.notification-empty strong,.notification-empty span{display:block}.notification-empty strong{color:#344054;font-size:11px}.notification-empty span{color:#8a93a2;font-size:9px;margin-top:4px}.settings-page{padding:32px 34px 40px}.settings-heading{display:flex;justify-content:space-between;margin-bottom:22px}.settings-heading h3{margin:0;font-size:25px;letter-spacing:-.7px}.settings-heading>div>p:last-child{color:#7d8797;font-size:12px;margin-top:7px}.settings-layout{display:grid;grid-template-columns:255px minmax(0,1fr);gap:20px;align-items:start}.settings-nav,.settings-card{background:#fff;border:1px solid #e6eaf0;border-radius:12px}.settings-nav{padding:7px}.settings-nav-item{width:100%;border:0;background:transparent;border-radius:9px;padding:12px 10px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer}.settings-nav-item:hover,.settings-nav-item.active{background:#eef1f5}.settings-nav-icon{width:31px;height:31px;border-radius:8px;background:#f0f3f7;display:flex;align-items:center;justify-content:center;color:#44536b;flex-shrink:0}.settings-nav-item strong,.settings-nav-item small{display:block}.settings-nav-item strong{color:#344054;font-size:11px}.settings-nav-item small{color:#8a93a2;font-size:9px;margin-top:3px}.settings-card{padding:22px}.settings-card-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:18px;border-bottom:1px solid #edf0f4}.settings-card-heading h4{margin:0;color:#172033;font-size:15px}.settings-card-heading p{margin-top:4px;color:#8a93a2;font-size:10px}.save-badge,.security-badge,.preference-status{border-radius:999px;padding:5px 8px;font-size:9px;font-weight:700}.save-badge,.security-badge{background:#edf8f1;color:#3e865e}.profile-summary{display:flex;align-items:center;gap:12px;padding:20px 0}.avatar-xl{width:54px;height:54px;font-size:17px}.profile-summary strong,.profile-summary span,.profile-summary small{display:block}.profile-summary strong{color:#253044;font-size:14px}.profile-summary span{color:#667085;font-size:10px;margin-top:3px}.profile-summary small{color:#8a93a2;font-size:9px;margin-top:2px}.settings-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.settings-form-grid label{display:block}.settings-form-grid label>span{display:block;color:#344054;font-size:10px;font-weight:700;margin-bottom:6px}.settings-form-grid input{width:100%;border:1px solid #dfe4ea;background:#fff;border-radius:8px;padding:10px 11px;color:#253044;font-size:11px;outline:none}.settings-form-grid input:focus{border-color:#9aa8bc;box-shadow:0 0 0 3px rgba(80,100,125,.08)}.settings-form-grid input[readonly]{background:#f7f8fa;color:#667085}.settings-form-grid label small{display:block;color:#98a2b3;font-size:8px;line-height:1.5;margin-top:5px}.settings-actions{display:flex;justify-content:flex-end;margin-top:22px;padding-top:18px;border-top:1px solid #edf0f4}.preference-row{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:17px 0;border-bottom:1px solid #edf0f4}.preference-row:last-child{border-bottom:0}.preference-row strong,.preference-row span{display:block}.preference-row strong{color:#344054;font-size:11px}.preference-row div>span{color:#8a93a2;font-size:9px;margin-top:4px}.preference-status{background:#f0f3f7;color:#52657d;white-space:nowrap}.security-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:#edf0f4;margin:20px 0;border:1px solid #edf0f4;border-radius:9px;overflow:hidden}.security-grid>div{background:#fff;padding:15px}.security-grid span,.security-grid strong{display:block}.security-grid span{color:#8a93a2;font-size:9px}.security-grid strong{color:#344054;font-size:11px;margin-top:4px;overflow-wrap:anywhere}.danger-zone{border:1px solid #f0d6d6;background:#fffafa;border-radius:9px;padding:15px;display:flex;justify-content:space-between;align-items:center;gap:16px}.danger-zone strong,.danger-zone span{display:block}.danger-zone strong{color:#8e3d3d;font-size:11px}.danger-zone span{color:#9b7777;font-size:9px;margin-top:4px}.danger-zone button{border:1px solid #d99a9a;background:#fff;color:#a33f3f;border-radius:7px;padding:8px 11px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap}.about-card{text-align:center;padding:42px 30px}.about-mark{width:62px;height:62px;margin:0 auto 16px;border-radius:16px;background:#172033;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px}.about-card h4{margin:0;color:#172033;font-size:20px}.about-card>p:not(.eyebrow){color:#7d8797;font-size:11px;line-height:1.7;max-width:520px;margin:8px auto 20px}.about-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;text-align:left;max-width:520px;margin:0 auto}.about-meta span{background:#f7f8fa;border:1px solid #edf0f4;border-radius:8px;padding:10px;color:#7d8797;font-size:9px}.about-meta strong{color:#344054;margin-right:4px}@media(max-width:1050px){.settings-layout{grid-template-columns:210px minmax(0,1fr)}}@media(max-width:820px){.settings-layout{grid-template-columns:1fr}.settings-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.profile-menu{right:12px}}@media(max-width:560px){.stats-grid,.settings-form-grid,.security-grid,.about-meta{grid-template-columns:1fr}.settings-nav{grid-template-columns:1fr}.notification-panel{position:fixed;right:12px;left:12px;width:auto;top:64px}}\n''', encoding="utf-8")
          workflow = Path(".github/workflows/final-frontend.yml")
          workflow.unlink(missing_ok=True)
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.jsx frontend/src/App.css .github/workflows/final-frontend.yml
          git commit -m "Finish professional frontend shell and account settings" || exit 0
          git push origin HEAD:codex/final-frontend
